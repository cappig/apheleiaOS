name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_check:
    name: source-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format e2fsprogs

      - name: check formatting
        run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format --dry-run --Werror

      - name: check scripts
        run: |
          python3 -m compileall -q kernel utils
          for script in utils/*.sh; do
            sh -n "$script"
          done

      - name: check image builder
        run: |
          image_one=$(mktemp)
          image_two=$(mktemp)
          export SOURCE_DATE_EPOCH=1767225600
          build_image() {
            python3 - "$1" <<'PY'
          import sys
          from pathlib import Path

          from kernel.build_image_common import build_ext2_image

          build_ext2_image(
              Path("root"),
              Path(sys.argv[1]),
              growth_numerator=1,
              growth_denominator=1,
              minimum_bytes=0,
          )
          PY
          }
          build_image "$image_one"
          build_image "$image_two"
          e2fsck -fn "$image_one"
          cmp "$image_one" "$image_two"

  build_test:
    name: build-test (${{ matrix.arch }})
    needs: source_check
    runs-on: ubuntu-latest
    env:
      GNU_CC_x86_32: gcc
      GNU_LD_x86_32: ld
      GNU_OC_x86_32: objcopy
      GNU_ST_x86_32: strip
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]

    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            gcc \
            gcc-multilib \
            gcc-mingw-w64 \
            make \
            nasm \
            python3 \
            xorriso

      - name: make test build
        run: make ARCH=${{ matrix.arch }} IMAGE_FORMAT=img

  build_riscv:
    name: build-riscv (${{ matrix.arch }})
    needs: source_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv_64, riscv_32]

    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            make \
            python3

      - name: make riscv image
        run: make ARCH=${{ matrix.arch }} IMAGE_FORMAT=img TOOLCHAIN=llvm

  build_iso:
    name: iso (${{ matrix.arch }})
    needs: source_check
    runs-on: ubuntu-latest
    env:
      GNU_CC_x86_32: gcc
      GNU_LD_x86_32: ld
      GNU_OC_x86_32: objcopy
      GNU_ST_x86_32: strip
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_32]

    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            gcc \
            gcc-multilib \
            gcc-mingw-w64 \
            make \
            nasm \
            python3 \
            xorriso

      - name: make iso
        run: make ARCH=${{ matrix.arch }} IMAGE_FORMAT=iso

      - name: upload iso
        uses: actions/upload-artifact@v4
        with:
          name: apheleia-${{ matrix.arch }}-iso
          path: bin/*_${{ matrix.arch }}.iso
          if-no-files-found: error
