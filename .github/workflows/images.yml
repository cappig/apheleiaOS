name: images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: source-check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs

      - name: Check sources
        run: |
          git ls-files -z '*.c' '*.h' '*.cpp' | \
            docker run --rm -i \
              -v "$PWD:/src" \
              -w /src \
              alpine:3.24.1 \
              sh -c 'apk add --no-cache clang22-extra-tools >/dev/null && xargs -0 clang-format --dry-run --Werror'
          python3 -m compileall -q kernel utils
          python3 utils/arch/check_boundary.py
          find utils -type f -name '*.sh' -exec sh -n {} +

      - name: Check image builder
        run: |
          image_one=$(mktemp)
          image_two=$(mktemp)
          export SOURCE_DATE_EPOCH=1767225600
          build_image() {
            python3 - "$1" <<'PY'
          import sys
          from pathlib import Path

          from kernel.build_image_common import build_ext2_image

          build_ext2_image(
              Path("root"),
              Path(sys.argv[1]),
              growth_numerator=1,
              growth_denominator=1,
              minimum_bytes=0,
          )
          PY
          }
          build_image "$image_one"
          build_image "$image_two"
          e2fsck -fn "$image_one"
          cmp "$image_one" "$image_two"

  build:
    name: ${{ matrix.artifact }}
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: apheleia-x86_64-img
            arch: x86_64
            image_format: img
            toolchain: gnu
            riscv_frisc: "false"
          - artifact: apheleia-x86_32-img
            arch: x86_32
            image_format: img
            toolchain: gnu
            riscv_frisc: "false"
          - artifact: apheleia-x86_64-iso
            arch: x86_64
            image_format: iso
            toolchain: gnu
            riscv_frisc: "false"
          - artifact: apheleia-x86_32-iso
            arch: x86_32
            image_format: iso
            toolchain: gnu
            riscv_frisc: "false"
          - artifact: apheleia-riscv_64-img
            arch: riscv_64
            image_format: img
            toolchain: gnu
            riscv_frisc: "false"
          - artifact: apheleia-riscv_32-img
            arch: riscv_32
            image_format: img
            toolchain: gnu
            riscv_frisc: "false"
          - artifact: apheleia-riscv_32-frisc-img
            arch: riscv_32
            image_format: img
            toolchain: gnu
            riscv_frisc: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          make clean
          make docker_build \
            ARCH=${{ matrix.arch }} \
            TOOLCHAIN=${{ matrix.toolchain }} \
            IMAGE_FORMAT=${{ matrix.image_format }} \
            RISCV_FRISC=${{ matrix.riscv_frisc }}

      - name: Smoke test
        if: matrix.image_format == 'img'
        run: |
          sudo apt-get update
          if [ "${{ startsWith(matrix.arch, 'x86') }}" = "true" ]; then
            sudo apt-get install -y qemu-system-x86
          else
            sudo apt-get install -y qemu-system-misc
          fi
          image=bin/apheleia_*_${{ matrix.arch }}.img
          memory=256M
          if [ "${{ matrix.riscv_frisc }}" = "true" ]; then
            image=bin/smoke/apheleia_*_${{ matrix.arch }}.img
            memory=16M
          fi
          python3 utils/smoke_test.py \
            $image \
            --arch ${{ matrix.arch }} \
            --memory $memory

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/apheleia_*_${{ matrix.arch }}.${{ matrix.image_format }}
          if-no-files-found: error
