# This file contains options that get loaded and parsed by the bootloader
# They can be used to configure both the kernel and the bootloader

# Minimum logging severity
log.level=debug # [debug, info, warn, error, fatal, none]

# Earliest boot messages use the built-in %m layout until this file is read
# Layout fields: %t time, %l level, %s source, %n line, %m message, %% percent
#log.format="[%t] %l %s:%n: %m"
log.format="%l %m"
# Color defaults to the build setting
# log.color=false

# Graphics options
video=graphics # [graphics, text, none]

# If we leave these undefined the bootloader will autodetect a resolution
# graphics.width = 1280
# graphics.height = 720
# graphics.bpp = 32 # bits per pixel

# font=/etc/cozette.psf
font=/etc/ter-116n.psf

# Stage the rootfs image into RAM before the kernel mounts it.
# stage_rootfs=false

# The kernels console will print output to any number of devices
# List them out and separate by ','. The string can be at most 128 bytes long
console=/dev/ttyS0,/dev/console
